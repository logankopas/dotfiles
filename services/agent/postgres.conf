# PostgreSQL for development and tests (Dockerfile: PostgreSQL section). Runs as agent from the
# cluster entrypoint.sh initialises on the workspace. localhost only: the port is not published.
# SIGINT is Postgres's "fast" shutdown (rolls back open transactions, checkpoints, exits);
# supervisord's default SIGTERM is "smart" and waits for every client to disconnect.
# max_connections=300 (2026-11-20, alm-qabfs): concurrent doc-editor gates use ~22-26 connections
# each and exhausted the default 100 (FATAL 53300). The command line outranks the data dir's
# postgresql.conf, so a fresh cluster keeps 300. The Dockerfile asserts this flag at build time.
[program:postgres]
command=/usr/lib/postgresql/17/bin/postgres -D /home/agent/workspace/.postgres/17 -c listen_addresses=localhost -c unix_socket_directories=/run/postgresql -c max_connections=300
user=agent
directory=/home/agent
priority=10
autostart=true
autorestart=true
startsecs=3
stopsignal=INT
stopwaitsecs=60
redirect_stderr=true
stdout_logfile=/var/log/supervisor/postgres.log
