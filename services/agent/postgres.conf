# PostgreSQL for development and tests (Dockerfile: PostgreSQL section). Runs as agent from the
# cluster entrypoint.sh initialises on the workspace. localhost only: the port is not published.
# SIGINT is Postgres's "fast" shutdown (rolls back open transactions, checkpoints, exits);
# supervisord's default SIGTERM is "smart" and waits for every client to disconnect.
[program:postgres]
command=/usr/lib/postgresql/17/bin/postgres -D /home/agent/workspace/.postgres/17 -c listen_addresses=localhost -c unix_socket_directories=/run/postgresql
user=agent
directory=/home/agent
priority=10
autostart=true
autorestart=true
startsecs=3
stopsignal=INT
stopwaitsecs=60
redirect_stderr=true
stdout_logfile=/var/log/supervisor/postgres.log
