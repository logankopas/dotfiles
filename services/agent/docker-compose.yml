services:
  agent:
    build: .
    container_name: agent_sandbox
    restart: unless-stopped
    # docker stop waits this long before SIGKILL. It must cover the longest supervisord
    # stopwaitsecs (gardenOS: its 120 s stop budget plus margin).
    stop_grace_period: 180s
    volumes:
      - /home/logan/agent-workspace:/home/agent/workspace
      - /home/logan/secrets:/home/agent/secrets:ro
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - docker
    environment:
      - TZ=America/Edmonton
      - TERM=xterm-256color
    env_file:
      - .env
    ports:
      - "2222:22"
      - "4000:4000"   # doc-editor Phoenix dev server (mix phx.server), 2026-10-27
    # homelab: NPM proxies gardenos.kopas.me to agent_sandbox:4100 (gardenos-web; web UI spec
    # 2026-11-18 section 9). default keeps the agent_default network the container already uses.
    networks:
      - default
      - homelab

networks:
  homelab:
    external: true
    name: homelab
