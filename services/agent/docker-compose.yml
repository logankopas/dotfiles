services:
  agent:
    build: .
    container_name: agent_sandbox
    restart: unless-stopped
    volumes:
      - /home/logan/agent-workspace:/home/agent/workspace
      - /home/logan/secrets:/home/agent/secrets:ro
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - docker
    environment:
      - TZ=America/Edmonton
      - TERM=xterm-256color
      - BAILIAN_TOKEN_PLAN_API_KEY
    env_file:
      - .env
    ports:
      - "2222:22"
