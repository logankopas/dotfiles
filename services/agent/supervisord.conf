# PID 1 of the agent container (entrypoint.sh execs it after setup).
# The image owns supervisord itself; each project owns its program blocks,
# included from its own repo, so a project's run command, restart policy and
# stop timeout change with its code, not with a rebuild.

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/run/supervisord.pid
childlogdir=/var/log/supervisor

# agent controls programs without sudo: `supervisorctl status|start|stop <name>`.
[unix_http_server]
file=/run/supervisor.sock
chmod=0770
chown=root:agent

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

# A glob that matches nothing is not an error: the image boots before a repo
# has its program file.
[include]
# doc-editor ops/container: the zeddocs.ca signup watcher (2026-11-13).
files = /etc/supervisor/conf.d/*.conf /home/agent/workspace/projects/gardenos/priv/supervisor/*.conf /home/agent/workspace/projects/doc-editor/ops/container/*.conf
