# Job "full": everything, nightly, to the blue disk. Sourced by /usr/local/sbin/borg-backup (bash).
# No secrets here. After editing in dotfiles: sudo ./homelab.sh --skip-docker --skip-secrets
ENABLED=yes
REPO=/mnt/borg/repos/full
MOUNTPOINT=/mnt/borg                          # job refuses to run unless this is a mountpoint

SOURCES=(/etc /home /root /var)               # /home/logan/staging (old-disk data) is inside /home
EXCLUDES=/etc/borg/excludes-full
COMPRESSION=lz4

KEEP_DAILY=7
KEEP_WEEKLY=4
KEEP_MONTHLY=6

# Extra args for the weekly quick check. A full `borg check` reads the whole repo (hours on USB);
# switch to "--archives-only --last 7" if the weekly run is too slow. Monthly always runs --verify-data.
CHECK_QUICK_ARGS=""

# Restore test: files are sampled from the latest archive under these paths, extracted and hashed
# against the live file (only files unchanged since the archive started count).
RESTORE_TEST_DIRS=(/etc /home/logan/staging /home/megan /var/selfhosted/immich/library)
RESTORE_TEST_PER_DIR=20
RESTORE_TEST_MAX_BYTES=67108864               # 64 MiB

PRE_HOOKS=(/etc/borg/hooks/immich-db-dump)   # consistent Postgres dump before the snapshot
POST_HOOKS=()

LOCK_WAIT=21600                               # seconds to wait for another run of this job (6 h)
