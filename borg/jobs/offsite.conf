# Job "offsite": same as "full", to a borg-over-ssh repository. Disabled until a destination exists.
# To enable: borg init --encryption=repokey-blake2 <REPO>; set REPO; ENABLED=yes; add
# systemd/backup-offsite.timer (+ check/verify timers); sudo ./homelab.sh --skip-docker --skip-secrets
ENABLED=no
REPO="ssh://USER@HOST:23/./borg/L-Desktop-full"
MOUNTPOINT=""                                 # remote: preflight uses `borg info` instead of mountpoint
BORG_RSH="ssh -i /etc/borg/offsite_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=accept-new"
# BORG_REMOTE_PATH=borg1                      # if the remote needs a specific borg binary

SOURCES=(/etc /home /root /var)
EXCLUDES=/etc/borg/excludes-full
COMPRESSION=zstd,3                            # bandwidth matters more than CPU offsite

KEEP_DAILY=7
KEEP_WEEKLY=4
KEEP_MONTHLY=12

CHECK_QUICK_ARGS="--archives-only --last 7"  # full checks over ssh are slow; monthly verify still runs
RESTORE_TEST_DIRS=(/etc /home/megan)
RESTORE_TEST_PER_DIR=10
RESTORE_TEST_MAX_BYTES=16777216

PRE_HOOKS=()
POST_HOOKS=()
LOCK_WAIT=21600
