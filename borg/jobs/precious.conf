# Job "precious": second copy of the irreplaceable data (photos + megan) on a separate disk.
ENABLED=yes                               # TOURO passed badblocks -w + SMART long test on 2026-11-04 -> second copy
REPO=/mnt/borg-precious/repos/precious
MOUNTPOINT=/mnt/borg-precious

SOURCES=(/var/selfhosted/immich/library /var/selfhosted/immich/db-dumps /home/megan)
EXCLUDES=/etc/borg/excludes-precious
COMPRESSION=lz4

KEEP_DAILY=7
KEEP_WEEKLY=4
KEEP_MONTHLY=3

CHECK_QUICK_ARGS=""
RESTORE_TEST_DIRS=(/var/selfhosted/immich/library /home/megan)
RESTORE_TEST_PER_DIR=20
RESTORE_TEST_MAX_BYTES=67108864

PRE_HOOKS=(/etc/borg/hooks/immich-db-dump)
POST_HOOKS=()
LOCK_WAIT=21600
